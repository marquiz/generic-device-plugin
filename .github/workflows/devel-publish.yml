name: Publish devel image and chart

on:
  push:
    branches:
      - custom-image
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the image and chart (must be valid semver, e.g. 0.2.0-devel.1). Defaults to <chart version>-g<short sha>."
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.repository_owner == 'marquiz'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/images/generic-device-plugin
      CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
      CHART_DIR: charts/generic-device-plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$(yq '.version' "$CHART_DIR/Chart.yaml")-g$(git rev-parse --short HEAD)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing with tag $tag"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64, linux/arm64, linux/arm
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package and push chart
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          yq -i ".image.repository = \"$IMAGE\" | .image.tag = \"$TAG\" | .image.pullPolicy = \"IfNotPresent\"" "$CHART_DIR/values.yaml"
          helm package "$CHART_DIR" --version "$TAG" --app-version "$TAG" --destination .chart-packages
          helm push .chart-packages/generic-device-plugin-"$TAG".tgz "$CHART_REPO"
